<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root{
            --cena:300px;
            --box:calc(var(--cena)/3);
            --meiobox: calc(var(--box)/4);

        }
        .box{position: absolute; 
            border: 1px solid black;
        }
        .cena{border: 1px solid black;         
            
        }
        .cubo{
               height: var(--box);
               width: var(--box);
               position:fixed;
               top:50%;
               left:50%;
               animation: rotacionar3d 10s linear infinite;
               transform-style: preserve-3d;
               perspective: 1000px;
        }
        .box{height: var(--box);width: var(--box);
        }
        #box-1{background-color: red;
            transform: translate3d(0,var(--meiobox),0) rotate3d(1,0,0,90deg);
        }
        #box-2{background-color: gray;
            transform: translate3d(var(--meiobox),0,0) rotate3d(0,1,0,90deg);}
        #box-3{background-color: green;
            transform: translate3d(0,0,var(--meiobox)) rotate3d(0,0,1,90deg) rotate3d(0,0,1,90deg);
        }
        #box-4{background-color: yellow;
            transform: translate3d(0,0,calc(var(--meiobox)*-1)) rotate3d(0,0,1,90deg);
        }
        #box-5{background-color: cornflowerblue;
            transform: translate3d(calc(var(--meiobox)*-1),0,0) rotate3d(0,1,0,90deg) ;
        }
        .cat{position: absolute;
            font-size: 80px;
        }

        @keyframes rotacionar3d{
                0%{transform: rotate3d(0,0,0,0deg) ;}
                5%{transform: rotate3d(1,0,0,90deg) ;}
                10%{transform: rotate3d(1,0,0,90deg);}
                15%{transform: rotate3d(1,0,0,90deg) rotate3d(0,1,0,90deg) ;}
                20%{transform: rotate3d(1,0,0,90deg) rotate3d(0,1,0,90deg) ;}
                25%{transform: rotate3d(1,0,0,90deg) rotate3d(0,1,0,90deg) ;}
                30%{transform: rotate3d(1,0,0,90deg) rotate3d(0,1,0,90deg) rotate3d(0,0,1,90deg) ;}
                35%{transform: rotate3d(1,0,0,90deg) rotate3d(0,1,0,90deg) rotate3d(0,0,1,90deg) ;}
                40%{transform: rotate3d(1,0,0,90deg) rotate3d(0,1,0,90deg) rotate3d(0,0,1,90deg) ;}
                

                
        
        }

    </style>
</head>

<body>
    <div class="cena">
        <div class="cubo">
            <div class="box" id="box-1">box-1</div>
            <div class="box" id="box-2">box-2</div>
            <div class="box" id="box-3">box-3</div>
            <div class="box" id="box-4">box-4</div>
            <div class="box" id="box-5">box-5</div>
            <div class="cat">🐈</div>
        </div>
    </div>

</body>

</html>
