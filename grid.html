<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            height: 100vh;
            grid-template-areas:
                "header   header      header "   
                "main     .  sidebar"
                "footer footer footer"
            ;
            grid-template-rows: 20vh 60vh 20vh;
       
        }
        #box1{background-color: rgb(247, 140, 0);
            grid-area: header;
        }
        #box2{background-color: rgb(27, 164, 248);
            grid-area:main;
        }
        #box3{background-color: rgb(226, 39, 86);
            grid-area:sidebar;
        }
        #box4{background-color: rgb(20, 23, 100);
        grid-area:footer;}
        



    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
      
    </div>
    
</body>
</html>
